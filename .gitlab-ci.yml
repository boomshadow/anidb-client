---
############################
# Setup
############################
# Shared security-scanning templates (Semgrep SAST, Grype dependency scanning, and the
# .grype.yaml exception audit). Consumed from the default branch with no `ref:` -- they
# roll `main` by design, so each soaked scanner-image bump in ci-templates lands here on
# the next pipeline with no second soak.
#
# container-scanning is intentionally NOT included. This project's deliverable is a wheel
# on PyPI, not an image; the Dockerfile here is a development and test harness that is
# never published, so scanning it would gate releases on findings in a build tool that
# ships to nobody. Dependency scanning covers the surface that does reach users.
include:
  - project: 'boomshadow_private/personal/ci-templates'
    file:
      - '/templates/sast.yml'
      - '/templates/dependency-scanning.yml'
      - '/templates/exception-audit.yml'

stages:
  - validate
  - test
  - build
  - security
  - drift-detection   # Anchored Development anchor-watch (MR-only)
  - publish

# Pinned uv image (Python 3.14 + uv) shared by every job below. uv 0.11.25
# (2026-06-27, within the 45-day soak); index digest verified from ghcr.io, and the
# same one the Dockerfile pins so local and CI runs use an identical toolchain.
.uv-image: &uv_image >-
  ghcr.io/astral-sh/uv:0.11.25-python3.14-trixie-slim@sha256:2b2e474b3a72e84c92b18a2f011a14adcb045fb361f7d8667ed1f8f55eefdafd

# The same uv, Python and Debian release as above, on the full base rather than the slim
# one -- so it carries `git`, which the slim variant does not. Exactly one job needs it:
# reading the subjects of the commits a push added. Renovate's "uv toolchain image" group
# matches this repository too, so both digests move together and cannot drift apart.
.uv-image-git: &uv_image_git >-
  ghcr.io/astral-sh/uv:0.11.25-python3.14-trixie@sha256:c9b4e559268d8a359ccb88187d24378085c8897daf960357b47c860eb49e867c

# Run a merge-request pipeline for MRs; otherwise a branch pipeline -- but never both for
# the same branch at once (avoids duplicate pipelines when a branch has an open MR).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

############################
# Shared rules
############################
# Runs on branch pushes (including main) and merge requests -- but NOT on the daily
# security-rescan schedule. A scheduled pipeline is the rescan: only the security stage
# (the included templates, which opt into `schedule` themselves) should run, so our own
# jobs skip on schedule.
.rules-always:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Publishing only ever happens from a version tag, never from a branch. Not "annotated":
# `$CI_COMMIT_TAG` is set for a lightweight tag too, so no rule here could tell the two
# apart, and a comment claiming a constraint nothing enforces is worse than no comment.
#
# Deliberately broad: any `v`-prefixed tag reaches the publish job, and whether it is a
# legal release tag is decided there, loudly. A rule narrow enough to filter out a
# malformed tag would instead run no job at all -- which looks exactly like a
# successful publish to whoever pushed it, and is the failure most likely to bite after
# a long gap, when the exact spelling has been forgotten. See SPEC-009.
.rules-tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Merge requests only, and never for Renovate's branches. Used by the drift gate: drift is
# a pre-merge check rather than something to run on every branch push, and a dependency
# bump is not a behavioural change to anchor against the specs. All Renovate branches are
# prefixed `renovate/`; its MRs are matched by source-branch name, since
# `$CI_COMMIT_BRANCH` is undefined in a merge_request_event pipeline.
.rules-merge-request-only-no-renovate:
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Shared uv setup. The cache is keyed on uv.lock, so it is reused until a dependency
# actually changes. `--frozen` makes the job fail if uv.lock is out of date with
# pyproject.toml rather than quietly resolving something different from local runs.
.uv-job:
  image: *uv_image
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen --group dev

############################
# Validate
############################
# The lockfile must match pyproject.toml exactly. Without this a dependency added to
# pyproject but never locked would install fine locally (uv resolves on the fly) and
# then differ from what every other job and every user gets.
validate:lockfile:
  extends:
    - .uv-job
    - .rules-always
  stage: validate
  before_script: []
  script:
    - uv lock --check

# Validate spec/ADR frontmatter and confirm the committed INDEX files are current. `--check`
# rebuilds each index from the frontmatter and fails if it differs from what was committed --
# i.e. the author changed a spec or ADR without re-running the generator -- without writing
# anything. The comparison lives in the generator rather than being a `git diff` here because
# this image is a Python toolchain and carries no git; installing one to compare two strings
# would put an unpinned apt package in the supply chain for no gain. The generators need
# pyyaml, which is in the dev group, so these reuse the same synced environment as every
# other job rather than needing a second image. See SPEC-000 and SPEC-008.
validate:spec-index:
  extends:
    - .uv-job
    - .rules-always
  stage: validate
  script:
    - uv run --frozen python .claude/skills/spec/scripts/generate_index.py --check

validate:adr-index:
  extends:
    - .uv-job
    - .rules-always
  stage: validate
  script:
    - uv run --frozen python .claude/skills/adr/scripts/generate_index.py --check

# Conventional-commit enforcement, split across two jobs because squash-on-merge means
# the text that becomes history is not the text on the branch.
#
# Neither job extends .uv-job: both scripts are standard library only, so there is
# nothing to install. That keeps them fast, and keeps a gate on what reaches the release
# notes from depending on a dependency resolution that could itself fail.
#
# A merge-request title is what GitLab turns into the squashed commit's subject, so that
# is what gets checked on a merge request. The branch's own commits are discarded by the
# squash; rejecting them would fail an MR over text that never reaches history.
validate:mr-title:
  stage: validate
  image: *uv_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python3 scripts/conventional_commit.py --title "$CI_MERGE_REQUEST_TITLE"

# The backstop, on the default branch only. It catches the two routes by which a subject
# reaches `main` without any merge-request title having been checked: a direct push made
# without opening one at all, and a squash message hand-edited in the merge dialog.
#
# Default branch only, deliberately. On a feature branch the commits are about to be
# squashed away, so failing a push over a work-in-progress subject would be noise.
# `GIT_DEPTH: 0` because the range reaches back to the previous tip, which a shallow
# clone is not guaranteed to contain.
validate:commit-messages:
  stage: validate
  image: *uv_image_git
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: 0
  script:
    # An all-zero "before" is a branch that did not previously exist, where there is no
    # range to read -- check the tip alone rather than the whole history.
    - |
      if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        git log --format=%s -1 "$CI_COMMIT_SHA" > subjects.txt
      else
        git log --format=%s "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA" > subjects.txt
      fi
    - cat subjects.txt
    - python3 scripts/conventional_commit.py --stdin < subjects.txt

############################
# Test
############################
lint:
  extends:
    - .uv-job
    - .rules-always
  stage: test
  script:
    # Emit the GitLab Code Quality report, rendered inline on the MR diff.
    # `|| true` so the report is always produced; the gating checks below fail the job.
    - uv run --frozen ruff check --output-format=gitlab . > gl-code-quality-report.json || true
    - uv run --frozen ruff check --output-format=full .
    - uv run --frozen ruff format --diff .
    - uv run --frozen codespell
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

typecheck:
  extends:
    - .uv-job
    - .rules-always
  stage: test
  script:
    - uv run --frozen mypy

# The suite never contacts AniDB: a fake UDP server on loopback stands in for the API,
# and an autouse fixture fails any test that addresses a non-loopback host. That is
# enforced by the tests themselves (tests/test_network_guard.py), not by this runner --
# so it holds on a developer's machine too.
test:
  extends:
    - .uv-job
    - .rules-always
  stage: test
  # A real PostgreSQL for the schema tests. SQLite does not exercise the native enum
  # types or the BigInteger/Integer variant the schema declares, so a SQLite-only run
  # covers neither branch. Same image and digest as docker-compose.yml, so a local
  # `task test` and this job talk to the same server version.
  services:
    - name: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      alias: db
  variables:
    POSTGRES_USER: anidb
    POSTGRES_PASSWORD: anidb
    POSTGRES_DB: anidb_test
    ANIDB_TEST_POSTGRES_URL: postgresql://anidb:anidb@db:5432/anidb_test
  script:
    - uv run --frozen pytest --cov --cov-branch --cov-report=term --cov-report=xml --junitxml=report.xml
    # The PostgreSQL-backed tests skip silently when the server is unreachable, which
    # would make this job quietly weaker than it looks. Fail instead.
    - uv run --frozen pytest -q -m postgres --no-cov -p no:cacheprovider
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

############################
# Build
############################
# Builds the wheel and sdist that the publish job uploads, so the artifact that is
# released is the one that was tested rather than one rebuilt at publish time.
build:dist:
  extends: .rules-always
  stage: build
  image: *uv_image
  variables:
    # Deliberately NOT extending .uv-job. That sets UV_CACHE_DIR to `.uv-cache`
    # inside the working tree, and `uv build` refuses to run with its cache inside
    # the directory it is building from ("The cache directory `.uv-cache` is
    # inside the build source directory"). This job also needs no `uv sync`: the
    # build backend is resolved into an isolated environment by `uv build` itself.
    UV_CACHE_DIR: /tmp/uv-cache
  script:
    - uv build
    # Fail loudly if the build produced something unexpected before it can be published.
    - ls -l dist/
    - test -n "$(find dist -name '*.whl')"
    - test -n "$(find dist -name '*.tar.gz')"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

############################
# Drift detection
############################
# Anchored Development enforcement (SPEC-000): compares the MR diff against the specs, ADRs,
# tests and navigation aids and fails the pipeline if they have drifted apart. MR-only, and
# never on renovate branches -- see .rules-merge-request-only-no-renovate above. Runs in the
# pinned anchor-watch image (Node + Claude Agent SDK), which drives the same agent defined at
# .claude/agents/drift-detector.md that a local session spawns as a subagent. Requires the
# CLAUDE_CODE_OAUTH_TOKEN project CI/CD variable for the Agent SDK to authenticate.
#
# This is the one job that costs a model run, so it waits on the checks that actually fail a
# pipeline -- validate and test -- and not on the scanners, which it runs alongside instead.
# `GIT_DEPTH: 0` because it diffs against the merge-request base commit, which the default
# shallow clone is not guaranteed to contain.
anchor-watch:
  extends: .rules-merge-request-only-no-renovate
  stage: drift-detection
  image: registry.gitlab.com/boomshadow/anchor-watch-image:2.0.1@sha256:baafe435f4b77d22d882cc57266292536f39b94af3fe3aa4a629b21a5a6b5269
  needs:
    - job: validate:lockfile
      artifacts: false
    - job: validate:spec-index
      artifacts: false
    - job: validate:adr-index
      artifacts: false
    - job: validate:mr-title
      artifacts: false
    - job: lint
      artifacts: false
    - job: typecheck
      artifacts: false
    - job: test
      artifacts: false
  variables:
    GIT_DEPTH: 0
  script:
    - node .claude/agents/scripts/ci-drift-detector.mjs
  allow_failure: false

############################
# Publish
############################
# PyPI trusted publishing (OIDC): PyPI verifies a short-lived GitLab identity token
# rather than a long-lived API token, so there is no upload credential stored in CI at
# all. The publisher is configured at https://pypi.org/manage/account/publishing/
# against four things -- the namespace, the project name, the path of the top-level
# pipeline file, and the environment named below. Note that the job name is NOT among
# them: PyPI never sees it, so renaming this job is safe and moving the `environment:`
# key to a different job is not.
#
# Runs only from a version tag, ordered after every earlier stage -- but note what that is
# and is not worth. The security stage is EMPTY on a tag: the shared scanners match merge
# requests, the default branch and the schedule, and a tag is none of those. So this job
# waits for a stage with no jobs in it, and clearing it proves nothing. What stands behind
# a release is that the tagged commit is `main` plus a version bump, and `main` is scanned
# on every push and daily. SPEC-008 states that guarantee and its limits.
publish:pypi:
  extends: .rules-tag-only
  stage: publish
  image: *uv_image
  environment:
    name: pypi
    url: https://pypi.org/project/anidb-client/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  # `dependencies:` and NOT `needs:`, deliberately. A job that declares `needs:` starts the
  # moment those jobs finish and ignores stage order entirely, which is the opposite of what
  # a publish stage is for. `dependencies:` narrows which artifacts are fetched without
  # touching ordering, so this job still waits for every earlier stage and still pulls only
  # the distributions the build stage produced.
  #
  # On a tag that ordering buys less than it looks: see the note above on the empty security
  # stage. It is kept because it is correct for every other ref, and because the day the
  # scanners do run on tags this job should already be behind them.
  dependencies:
    - build:dist
  script:
    # One gate, and the release workflow applies the same one before the tag is ever
    # created. It answers two questions: is this a legal release tag, and does every
    # built artifact carry the version that tag implies? A malformed tag fails naming
    # the spelling that would have worked; a tag on the wrong commit fails because the
    # artifacts disagree with it. Read from the artifact filenames rather than the
    # source, so what is checked is what is about to be uploaded.
    - python3 scripts/release_tag.py "$CI_COMMIT_TAG" --dist dist
    - uv publish --trusted-publishing always
