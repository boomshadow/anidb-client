[project]
name = "anidb-client"
description = "Object-oriented UDP client library for AniDB"
readme = "README.md"
requires-python = ">=3.14.5"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Tirey", email = "jacob@tirey.io" }]
keywords = ["anidb", "anime", "udp", "api", "client", "mylist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Single source of truth is `__version__` in the package (see [tool.hatch.version]).
# This is the distribution's own semantic version and is deliberately unrelated to
# `anidb_client_version`, the integer registered with AniDB and sent in AUTH.
dynamic = ["version"]

# Pinned exact and hash-locked in uv.lock (supply-chain rule). Each version is the
# latest released on or before the 45-day soak cutoff at the time it was pinned.
dependencies = [
    "pycryptodome==3.23.0",
    "sqlalchemy==2.0.51",
]

# No `nfs` extra on purpose. File(path='nfs://...') needs the `libnfs` Python module,
# whose newest release is a 2016 sdist that compiles against libnfs system headers.
# Declaring it installable would hand most users a build failure, so fileinfo.py keeps
# importing it softly and the README documents it as a manual prerequisite.

[project.urls]
Homepage = "https://github.com/boomshadow/anidb-client"
Source = "https://github.com/boomshadow/anidb-client"
Issues = "https://github.com/boomshadow/anidb-client/issues"

[dependency-groups]
# Same supply-chain rule as the runtime dependencies above: exact and hash-locked,
# latest within the 45-day soak window as of 2026-08-11.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Every test either talks to a loopback UDP server or exercises code that can
    # sleep on a retry path, and the transport is threaded. A suite-wide timeout
    # turns "CI hangs forever" into an ordinary test failure.
    "pytest-timeout==2.4.0",
    # PostgreSQL driver for the schema tests. Test-only: the library declares no
    # driver, since which one to install is the application's choice.
    "psycopg2-binary==2.9.12",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "codespell==2.4.2",
    # Reads spec/ADR frontmatter for the INDEX generators (task spec-index / adr-index).
    "pyyaml==6.0.3",
]

[tool.uv]
# Dependency cooldown -- the 45-day soak, enforced by the resolver rather than by
# discipline. Renovate's release-age filter governs the updates it *proposes*, but not
# the lockfile refreshes it delegates to the package manager, so transitive
# dependencies could otherwise land the day they are published. uv applies this to
# every resolution -- CI's, the bot's, and a developer's -- and records the resulting
# cutoff in uv.lock.
exclude-newer = "45 days"

# What makes uv rebuild this project rather than reuse a cached build of it.
#
# DO NOT REMOVE THE SECOND ENTRY. It looks redundant and is not. uv's default keys
# include the whole `src` directory, so listing one file inside it reads like belt and
# braces -- but a *content* change to a file in `src` does not invalidate the cached
# build. Measured against this exact uv version: bump `__version__` alone, sync, and the
# installed metadata still reports the old number, with a fresh virtualenv and a warm
# cache both.
#
# The version is read out of that file at build time, and the release bump is the one
# commit in the project's history that changes it and nothing else. So without this key
# the release commit installs metadata for the *previous* version, and the check that
# the built artifact matches the tag fails on the release itself -- never on a merge
# request, because no merge request ever bumps the version. Setting `cache-keys` at all
# replaces uv's defaults, so `pyproject.toml` is restated here rather than inherited.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/anidb_client/__init__.py" }]

# Deliberate soak exceptions, each dated just past the release it admits so a further
# bump has to be argued again rather than riding in on a standing waiver. **These are
# temporary**: delete an entry once its pinned version passes 45 days on the date
# noted. An empty table here is the healthy steady state.
[tool.uv.exclude-newer-package]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/anidb_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anidb_client"]

[tool.hatch.build.targets.sdist]
# The sdist carries the tests so downstream packagers can run them -- which means it must
# also carry anything they import. `scripts` is here for that reason alone: the release
# gate is not useful to a packager, but its tests are part of the suite and fail at
# collection without it.
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
# Declared, not inferred from requires-python: this value decides which rewrites
# UP/FURB propose and whether the formatter emits 3.14-only syntax, so it is
# worth stating outright rather than leaving to inference.
target-version = "py314"
# line-length 120: roomy for modern displays while still allowing side-by-side
# editing; E501 stays enforced as a guardrail.
line-length = 120

[tool.ruff.lint]
# Ruff subsumes flake8 + isort + pyupgrade + bugbear + refurb in one tool.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB"]
ignore = []

[tool.mypy]
python_version = "3.14"
# `scripts` is here rather than being left out as "just tooling". The release gate
# lives there and decides whether a version reaches PyPI, so it is held to the same
# standard as the library -- a script that is checked and tested is not glue.
files = ["src", "scripts"]
# Strict everywhere. This was a per-module list for as long as it took to annotate
# the package one module at a time; every module is on it now, so the list is the
# global setting. A new module is strict from its first line rather than opted in.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code"]

# --- Documented holes: third-party libraries without type information ---
# pycryptodome used to be listed here; as of 3.23.0 it ships py.typed and .pyi
# stubs for MD4 and AES, so the waiver was suppressing nothing.
#
# libnfs is an optional, soft-imported dependency for nfs:// paths and is not
# installed in the development environment at all.
[[tool.mypy.overrides]]
module = ["libnfs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# No single test should take anywhere near this long: the fake AniDB server runs on
# loopback and the rate limiter is injected with a fake clock in tests. A test that
# hits this has almost certainly blocked on a real socket or a real sleep().
timeout = 60
filterwarnings = ["error::DeprecationWarning:anidb_client.*"]
markers = [
    "postgres: needs a real PostgreSQL, from ANIDB_TEST_POSTGRES_URL (skipped when unset)",
]

[tool.coverage.run]
# `scripts` is measured alongside the library rather than left out as tooling. The release
# gate decides whether a version reaches PyPI, and a gate whose tests could be gutted
# without the floor noticing is not a gate.
source = ["anidb_client", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratcheting floor, raised as coverage grows -- a floor to defend, not a target to
# sit at. 28% when the suite was introduced, 40% once the object layer had a
# fixture, 55% now that the cache-freshness, mylist, external-mapping and
# filename-inference paths are covered, and 65% once responses.py was exercised
# (37% -> 96%, largely by constructing every class in the code table once), and 70
# once the adopted upstream-fork fixes brought their own tests -- mapper.py to 100%
# and animeobjs.py to 61%, and 75 once the correctness fixes brought tests for the
# fanart HTTP error paths, the optional FILE state field and the real anilist parse
# loop (anames.py 50% -> 67%), and 78 once the engine configuration and the cache
# session lifecycle brought their own tests -- db.py 96% -> 99% and animeobjs.py
# 66% -> 72%. Set a little under the measured figure so an unrelated change does
# not fail the build on rounding.
#
# The total also covers `scripts` now (see the source list above). That nudged the
# measured figure up without the library being any better tested, so the floor
# deliberately did NOT ratchet with it -- this number tracks work, not scope.
fail_under = 78
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.codespell]
# acount -- an AniDB API field name (anime count) carried on GroupTable
# fo     -- appears inside AniDB response payload samples, not prose
# TOOO   -- no longer emitted (the rollover tag is "T000" now), but the comments
#           and the regression test that record the old value still name it
ignore-words-list = "acount,fo,TOOO"
# Patterns are unanchored globs so they match however codespell is invoked. A
# "./"-anchored form only matches when codespell is run from the repository root with
# no path argument, and silently stops skipping otherwise.
# ISO-639-2_utf-8.txt is the ISO language-name table. Roughly two dozen of the
# language names in it look like misspellings of English words but are not, so the
# whole file is skipped rather than each name being added to the list above.
# (Naming them here would re-introduce the same false positives in this comment.)
skip = "*/.git,*/LICENSE,*ISO-639-2_utf-8.txt,*uv.lock,*/.venv,*/htmlcov,*/dist"
